[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mrcfile"]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "mrcfile.version.__version__"}
readme = {file = ["README.rst"]}

[project]
name = "mrcfile"
authors = [
    {name = "Colin Palmer", email = "colin.palmer@stfc.ac.uk"},
]
dynamic = ["version", "readme"]
description = "MRC file I/O library"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
requires-python = ">=3.9"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Software Development :: Libraries :: Python Modules'
]
dependencies = ["numpy >= 1.16.0"]

[project.urls]
homepage = "https://github.com/ccpem/mrcfile"
documentation = "https://mrcfile.readthedocs.io/"

[project.scripts]
'mrcfile-header' = 'mrcfile.command_line:print_headers'
'mrcfile-validate' = 'mrcfile.validator:main'

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

target-version = "py39"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "BLE",
    "C",
    "COM",
    "E",
    "ERA",
    "F",
    "I",
    "PLR",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T",
    "W",
]
ignore = [
    "B028",  # explicit stacklevel keyword in warnings
    "COM812",  # trailing commas
    "PLR2004",  # magic values
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ignore some rules that are not relevant to test code
"tests/**.py" = [
    "S101",
    "SLF001",
    "T",
]
